spring.application.name=category-service
server.port=8082

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:category-service}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.h2.console.enabled=true

microservices.item.url=${MICROSERVICES_ITEM_URL:http://localhost:8081}

